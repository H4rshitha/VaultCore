# VaultCore — 100% Free Tier Render Blueprint
# Provisions 1 Free PostgreSQL Database + 1 Free All-in-One Web Service ($0/month, No Card Required)

databases:
  - name: vaultcore-postgres
    databaseName: vaultcore_db
    user: vaultadmin
    plan: free
    region: oregon

services:
  - type: web
    name: vaultcore-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: GATEWAY_PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vaultcore-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_API_KEY
        generateValue: true
